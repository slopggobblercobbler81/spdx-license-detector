[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spdx-license-detector"
version = "0.1.0"
description = "An ultra-fast offline CLI and library that accurately classifies open-source LICENSE files against the canonical SPDX license catalog using normalized text matching and confidence scoring"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "spdx",
    "license",
    "license-detector",
    "classifier",
    "compliance",
    "sbom",
    "osi",
    "fsf",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/spdx-license-detector"
Repository = "https://github.com/slopggobblercobbler81/spdx-license-detector.git"
Issues = "https://github.com/slopggobblercobbler81/spdx-license-detector/issues"

[project.scripts]
spdx-detect = "spdx_license_detector.cli:main"
spdx-license-detector = "spdx_license_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
